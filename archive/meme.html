<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Intermission — Same Page</title>
  <meta name="description" content="A quick meme intermission before the team continues to the next question.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body class="viewport-fit-page meme-body">

  <!-- ==========================================================================
       1. TOP SITE HEADER
       ========================================================================== -->
  <header class="minimal-header">
    <a href="index.html" class="brand-group" id="brand-logo-link">
      <span class="brand-logo-frame">
        <img class="brand-logo" src="samepage-logo.svg" alt="" aria-hidden="true" width="36" height="36">
      </span>
      <span class="brand-name">Same Page</span>
    </a>

    <div class="header-nav">
      <!-- Participant Count Badge -->
      <div class="header-participants-badge" id="header-participants-badge" title="Session participants">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span id="header-participants-count">2 Participants</span>
      </div>

      <!-- Duration Badge -->
      <div class="header-duration-badge" id="header-duration-badge" title="Session duration">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span id="header-duration-text">04:15</span>
      </div>

      <!-- User Avatar -->
      <div class="nav-avatar-icon" title="Account profile">
        <span>A</span>
      </div>
    </div>
  </header>

  <!-- ==========================================================================
       2. MEME STAGE CANVAS
       ========================================================================== -->
  <main class="meme-canvas-wrapper" id="meme-canvas-wrapper">
    
    <!-- Top Pill -->
    <div class="question-round-indicator">
      <span class="round-indicator-dot" aria-hidden="true"></span>
      <span>Intermission &bull; Room Reset</span>
    </div>

    <!-- Meme Caption / Headline -->
    <div class="meme-header-group">
      <h1 class="meme-headline" id="meme-headline">
        Sarah Jenkins be like
      </h1>
      <p class="meme-sub-caption" id="meme-sub-caption">
        Waiting for backend to fix the database latency before scaling marketing campaigns.
      </p>
    </div>

    <!-- Direct Meme GIF Image (No card wrapper, no tag) -->
    <div class="meme-gif-display">
      <img class="meme-gif-image"
           id="meme-gif-image"
           src="https://media.giphy.com/media/bLzSbiS3Lzkrwl6ENS/giphy.gif"
           alt="Sarah Jenkins waiting meme"
           loading="eager" />
    </div>

    <!-- Action Button with Duration on Left of Text -->
    <div class="meme-actions-container">
      <button type="button" class="btn-force-next-question" id="btn-force-next">
        <!-- 7-Second Duration Counter Pill (Left side of text) -->
        <span class="btn-countdown-pill" id="btn-countdown-timer">07s</span>
        <span class="btn-text-label">Next question</span>
        <svg class="btn-arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
